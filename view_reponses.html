<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>View Alert Responses - NariSuraksha</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(to right, #ff758c, #ff7eb3);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding-top: 50px;
        }

        .container {
            background-color: white;
            padding: 30px;
            border-radius: 12px;
            width: 90%;
            max-width: 900px;
            box-shadow: 0 0 25px rgba(0, 0, 0, 0.1);
        }

        h2 {
            text-align: center;
            color: #e91e63;
            margin-bottom: 20px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        th, td {
            padding: 12px;
            border: 1px solid #ddd;
            text-align: left;
        }

        th {
            background-color: #e91e63;
            color: white;
        }

        tr:nth-child(even) {
            background-color: #f9f9f9;
        }

        .back-link {
            text-align: center;
            margin-top: 20px;
        }

        .back-link a {
            color: #e91e63;
            text-decoration: none;
            font-weight: bold;
        }

        .back-link a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>📋 Your Alert History & Responses</h2>

        <!-- This table will later be populated using backend data -->
        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Location</th>
                    <th>Alert Type</th>
                    <th>Description</th>
                    <th>Date</th>
                    <th>Status</th>
                </tr>
            </thead>
            <tbody>
                <!-- Sample Data Row -->
                <tr>
                    <td>101</td>
                    <td>MG Road</td>
                    <td>Harassment</td>
                    <td>Someone followed me near the station.</td>
                    <td>2025-07-13</td>
                    <td style="color: green;">Responded</td>
                </tr>
                <tr>
                    <td>102</td>
                    <td>Bus Stop</td>
                    <td>Emergency</td>
                    <td>Dangerous situation near the stop.</td>
                    <td>2025-07-12</td>
                    <td style="color: orange;">Pending</td>
                </tr>
            </tbody>
        </table>

        <div class="back-link">
            <a href="user_dashboard.html">⬅️ Back to Dashboard</a>
        </div>
    </div>

</body>
</html>
