<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Admin Dashboard - NariSuraksha</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(to right, #ff758c, #ff7eb3);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .dashboard {
            background-color: #fff;
            padding: 40px;
            border-radius: 12px;
            width: 450px;
            box-shadow: 0 0 25px rgba(0,0,0,0.1);
            text-align: center;
        }

        h2 {
            color: #e91e63;
            margin-bottom: 25px;
        }

        .btn-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .btn-container a {
            padding: 12px;
            background-color: #e91e63;
            color: white;
            text-decoration: none;
            font-weight: bold;
            border-radius: 8px;
            transition: background-color 0.3s ease;
        }

        .btn-container a:hover {
            background-color: #c2185b;
        }

        .footer {
            margin-top: 30px;
            font-size: 13px;
            color: #777;
        }
    </style>
</head>
<body>

    <div class="dashboard">
        <h2>👩‍💼 Admin Dashboard</h2>

        <div class="btn-container">
            <a href="manage_police.html">🔍 Add/View/Delete Police</a>
            <a href="admin_user_table_view.jsp">👩‍💻 View Users</a>
            <a href="view_alerts_admin.jsp">🚔 View Alerts</a>
            <a href="logout.html">🚪 Logout</a>
        </div>

        <div class="footer">
            &copy; 2025 NariSuraksha | Women Safety Admin Panel
        </div>
    </div>

</body>
</html>
